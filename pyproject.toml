[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "playodds"
version = "0.2.0"
description = "Odds that a new Google Play app reaches 10K, 100K or 1M installs, from launch-day facts"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Matin Nikoomanzar"}]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[project.scripts]
playodds = "playodds.cli:main"

[tool.setuptools]
packages = ["playodds"]

[tool.pytest.ini_options]
testpaths = ["tests"]
